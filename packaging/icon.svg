<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824×824 rounded square centred on a 1024 canvas. -->
  <!-- The dots are the app's status icons: Todo, In Progress, Done. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="292" cy="512" r="82" fill="none" stroke="#b4b4bc" stroke-width="26"/>
  <circle cx="512" cy="512" r="82" fill="none" stroke="#f2c94c" stroke-width="26"/>
  <circle cx="512" cy="512" r="36" fill="#f2c94c"/>
  <circle cx="732" cy="512" r="95" fill="#7c8cff"/>
  <path d="M690 514 l30 30 l58 -62" fill="none" stroke="#1c1c1f" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
