[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/solilog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
solilog-core = { path = "crates/solilog-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
rusqlite = { version = "0.42.0", features = ["backup", "bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "0.2"
unicode-segmentation = "1.13.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
